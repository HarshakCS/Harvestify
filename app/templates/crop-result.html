{% extends 'layout.html' %} {% block body %}

<style>
  .mt-0 {
  margin-top: 50 !important;
}
.crop-image {
width: 120px;
height: 120px;
object-fit: cover;
border-radius: 8px;
margin-bottom: 15px;
}
</style>

<div class="container py-2 mx-auto my-50 h-10 " style="margin: 12rem;">
  <div class="row">
      <div class="col-sm py-2 py-md-3">
          <div class="card card-body" style="justify-content: center; text-align: center;">
               <img src="/static/images/crops/{{ prediction.lower().replace(' ', '_') }}.jpg" 
               alt="{{ prediction }}" 
               class="crop-image mx-auto"
               onerror="this.src='/static/images/crop_background.jpg'">
               <h1 class="text-center"><b>You should grow <i>{{ prediction }} </i>in your farm</b></h1>
          </div>
      </div>
  </div>
</div>
{% endblock %}
